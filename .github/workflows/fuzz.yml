name: Fuzz APWorld
on:
  push:
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      AP_TEST_WORLDS: manual_xenobladechroniclesv2_xanderoni_skipperki1
    steps:
      - uses: Eijebong/ap-actions/fuzz@main
        with:
          apworld-path: manual_xenobladechroniclesv2_xanderoni_skipperki1
          fuzzer-commit: 53686ba34f9e8852cbe1970666a5f56fd6abf75a
          ap-version: 'latest'
          python-version: '3.12'
          runs: 50 # This is optional
          yamls-per-run: 1 # This is optional